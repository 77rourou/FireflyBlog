name: Build and Deploy to gh-pages

# 主分支 push 时自动构建，并将静态产物(dist)推送到 gh-pages 分支
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 推送到 gh-pages 分支需要的权限
permissions:
  contents: write

# 避免并发部署互相覆盖
concurrency:
  group: "deploy-gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build
        # 构建平台等"系统构建信息"由组件在构建时通过 ci-info 自动探测
        # （GHA 下稳定返回 "GitHub Actions"），不写死任何值，保持实时自动获取。

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy dist to gh-pages branch
        run: |
          cd dist
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
